version: "3.9"

x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  - ./docker:/app/docker
  - ./docker/superset_config.py:/app/pythonpath/superset_config.py
  - ./docker/superset_config_docker.py:/app/pythonpath/superset_config_docker.py:ro

services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: analytics_db
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
      - ./postgres/superset_init.sql:/docker-entrypoint-initdb.d/superset_init.sql
    networks:
      - my-network

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: airflow-dbt-platform:1.0.0
    container_name: airflow
    restart: unless-stopped
    command: ["bash", "-c", "exec /opt/airflow/scripts/init.sh"]
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db
    ports:
      - "8000:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./api-request:/opt/airflow/api-request
      - ./dbt:/opt/airflow/dbt
      - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    networks:
      - my-network
    # 💡 新增：檢查 Airflow 的 8080 端口（容器內）是否已經可以正常回應
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    #   interval: 30m
    #   timeout: 10s
    #   retries: 5

  superset-init:
    image: apache/superset:3.0.0-py310
    command:
      - /app/docker/docker-init.sh
    env_file:
      - path: docker/.env
        required: true
    # 💡 修改：調整依賴關係，讓它等 redis 啟動 + airflow 變成 healthy 狀態
    depends_on:
      redis:
        condition: service_started
      # airflow:
      #   condition: service_healthy
    user: *superset-user
    volumes: *superset-volumes
    environment:
      SUPERSET_LOAD_EXAMPLES: "${SUPERSET_LOAD_EXAMPLES:-yes}"
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
      DATABASE_DB: "superset_db"
      DATABASE_USER: "superset"
      DATABASE_PASSWORD: "superset"
    healthcheck:
      disable: true
    networks:
      - my-network
  
  superset:
    image: apache/superset:3.0.0-py310
    env_file:
      - path: docker/.env
        required: true
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    restart: unless-stopped
    ports:
      - ${SUPERSET_PORT:-8088}:8088
    user: *superset-user
    # 💡 這裡保持不變，因為 superset 本來就該等 superset-init 跑完才啟動
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    networks:
      - my-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data 
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  redis:
    external: false
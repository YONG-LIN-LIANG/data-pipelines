version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: analytics_db

    ports:
      - "5433:5432"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql

    networks:
      - my-network

  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow
    restart: unless-stopped
    command: >
      bash -c "pip install dbt-postgres==1.9.0 && airflow db migrate && airflow standalone"
    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db

    ports:
      - "8000:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      # 將本地 ./api-request 映射到容器裡的 /opt/airflow/api-request 路徑
      - ./api-request:/opt/airflow/api-request
      # 把 dbt 專案資料夾掛載進 Airflow 容器內部的 /opt/airflow/dbt
      - ./dbt:/opt/airflow/dbt
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

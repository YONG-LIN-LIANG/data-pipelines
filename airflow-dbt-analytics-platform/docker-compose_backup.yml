version: "3.9"


x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  - ./docker/superset_config.py:/app/pythonpath/superset_config.py

services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: analytics_db

    ports:
      - "5433:5432"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
      - ./postgres/superset_init.sql:/docker-entrypoint-initdb.d/superset_init.sql
    networks:
      - my-network

  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow
    restart: unless-stopped
    command: >
      bash -c "pip install dbt-postgres==1.9.0 && airflow db migrate && airflow standalone"
    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db

    ports:
      - "8000:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      # 將本地 ./api-request 映射到容器裡的 /opt/airflow/api-request 路徑
      - ./api-request:/opt/airflow/api-request
      # 把 dbt 專案資料夾掛載進 Airflow 容器內部的 /opt/airflow/dbt
      - ./dbt:/opt/airflow/dbt
    networks:
      - my-network
  
  superset:
    image: apache/superset:3.0.0-py310
    env_file:
      - path: docker/.env # default
        required: true
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    restart: unless-stopped
    ports:
      - ${SUPERSET_PORT:-8088}:8088
    user: *superset-user
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    networks:
      - my-network
  
  superset-init:
    image: apache/superset:3.0.0-py310
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    user: *superset-user
    volumes: *superset-volumes
    environment:
      SUPERSET_LOAD_EXAMPLES: "${SUPERSET_LOAD_EXAMPLES:-yes}"
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
      DATABASE_DB: "${POSTGRES_DB:-analytics_db}"
    healthcheck:
      disable: true
    networks:
      - my-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data 
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  redis:
    external: false